name: Release

# Push a tag like v0.2.0 to publish. Tags with a suffix (v0.2.0-rc1) become prereleases and
# leave the Homebrew cask alone, so they're safe for trying the pipeline.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Info.plist
        run: |
          tag=${GITHUB_REF_NAME#v}
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          [ "${tag%%-*}" = "$version" ] || { echo "Tag $tag doesn't match Info.plist $version" >&2; exit 1; }
      - name: Test
        run: swift test
      - name: Signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
              echo "::warning::SIGNING_CERTIFICATE isn't set, so the app is signed ad hoc and the Keychain will ask for the password again."
              exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # Self-signed, so it's listed as untrusted; codesign still uses it by hash.
          identity=$(security find-identity -p codesigning "$kc" | awk '/\)/ { print $2; exit }')
          [ -n "$identity" ] || { echo "No code signing identity in SIGNING_CERTIFICATE" >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make release
          codesign --verify --strict build/Clippeek.app
          codesign -d -r- build/Clippeek.app
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" build/Clippeek.zip build/Clippeek.zip.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes $pre
      - name: Homebrew cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
              echo "::warning::TAP_TOKEN isn't set, so the cask wasn't updated."
              exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          sha=$(cut -d' ' -f1 build/Clippeek.zip.sha256)
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" packaging/clippeek.rb > build/clippeek.rb
          current=$(gh api repos/tangheng05/homebrew-tap/contents/Casks/clippeek.rb --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/tangheng05/homebrew-tap/contents/Casks/clippeek.rb \
              -f message="clippeek $version" -f content="$(base64 -i build/clippeek.rb)" ${current:+-f sha="$current"} >/dev/null
          echo "Cask updated to $version"
