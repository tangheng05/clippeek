name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Snapshots
        run: make snapshots
      - name: App bundle
        run: make app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots
          path: build/snapshots
